{% extends 'base.html' %}

{% block title %}Welcome — Campus Courier{% endblock %}

{% block content %}
<div class="py-12 text-center">
  <h1 class="text-4xl font-extrabold tracking-tight text-brand-navy sm:text-5xl">
    Hyperlocal Parcel Delivery for UET Lahore
  </h1>
  <p class="mt-4 max-w-2xl mx-auto text-lg text-brand-navySubtext">
    Send parcels across campus quickly and securely. Couriers deliver with ML-predicted fair fares in PKR.
  </p>
  <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
    <a href="{% url 'login' %}" class="px-6 py-3 text-base font-semibold text-white bg-brand-green rounded-md shadow hover:bg-brand-greenDark transition min-h-touch inline-flex items-center justify-center w-full sm:w-auto">
      Login
    </a>
    <a href="{% url 'register' %}" class="px-6 py-3 text-base font-medium text-brand-navy bg-white border border-brand-grey rounded-md hover:bg-brand-greySubtle transition min-h-touch inline-flex items-center justify-center w-full sm:w-auto">
      Create Account
    </a>
  </div>
</div>
{% endblock %}
