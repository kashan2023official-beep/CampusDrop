{% extends 'base.html' %}

{% block title %}Server Error (500) — Campus Courier{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center px-4 py-12">
  <div class="w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-2xl font-bold mb-4 shadow-sm">
    500
  </div>
  <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Internal Server Error</h1>
  <p class="text-base text-gray-500 max-w-md mb-6">
    An unexpected error occurred while processing your request. Please try again shortly or return to your dashboard.
  </p>
  <div>
    <a href="{% url 'dashboard' %}" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-md shadow-sm hover:bg-indigo-700 transition">
      &larr; Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
