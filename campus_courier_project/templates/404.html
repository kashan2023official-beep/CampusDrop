{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Campus Courier{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center px-4 py-12">
  <div class="w-16 h-16 rounded-full bg-brand-yellow/20 text-brand-yellowDark flex items-center justify-center text-2xl font-bold mb-4 shadow-sm">
    404
  </div>
  <h1 class="text-3xl font-extrabold text-brand-navy tracking-tight mb-2">Page Not Found</h1>
  <p class="text-base text-brand-navySubtext max-w-md mb-6">
    Sorry, the page or resource you are looking for does not exist or has been moved within the campus system.
  </p>
  <div class="w-full sm:w-auto">
    <a href="{% url 'dashboard' %}" class="w-full sm:w-auto min-h-touch inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold text-brand-navy bg-brand-green rounded-md shadow-sm hover:bg-brand-greenDark transition">
      &larr; Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
