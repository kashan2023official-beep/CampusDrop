{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Campus Courier{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center px-4 py-12">
  <div class="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl font-bold mb-4 shadow-sm">
    404
  </div>
  <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Page Not Found</h1>
  <p class="text-base text-gray-500 max-w-md mb-6">
    Sorry, the page or resource you are looking for does not exist or has been moved within the campus system.
  </p>
  <div>
    <a href="{% url 'dashboard' %}" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-md shadow-sm hover:bg-indigo-700 transition">
      &larr; Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
