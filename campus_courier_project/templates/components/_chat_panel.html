<div x-data="chatPanel({{ order.id }})"
     @open-chat.window="openChat()"
     @close-chat.window="closeChat()">

  <!-- Backdrop (mobile only) -->
  <div x-show="open" x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click="closeChat()"
       class="fixed inset-0 z-40 bg-brand-navy/40 md:hidden"></div>

  <!-- Panel -->
  <div x-show="open" x-cloak
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="translate-y-full md:translate-y-0 md:translate-x-8"
       x-transition:enter-end="translate-y-0 md:translate-x-0"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="translate-y-0 md:translate-x-0"
       x-transition:leave-end="translate-y-full md:translate-y-0 md:translate-x-8"
       class="fixed z-50 flex flex-col bg-white shadow-2xl
              bottom-0 left-0 right-0 h-[85vh] rounded-t-3xl
              pb-[env(safe-area-inset-bottom)]
              md:bottom-6 md:right-6 md:left-auto md:top-auto
              md:w-[400px] md:h-[600px] md:rounded-3xl">

    <!-- Drag handle (mobile) -->
    <div class="md:hidden flex justify-center pt-3 pb-1">
      <div class="w-12 h-1.5 rounded-full bg-brand-grey"></div>
    </div>

    <!-- Header -->
    <div class="flex items-center gap-3 px-5 py-3 border-b border-brand-grey">
      <div class="w-10 h-10 rounded-full bg-brand-greenSoft flex items-center justify-center shrink-0">
        <i data-lucide="message-circle" class="w-5 h-5 text-brand-greenDarkText"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <p class="text-sm font-bold text-brand-navy truncate">
            {{ other_party.username|default:"Chat" }}
          </p>
          <span x-show="connected" class="w-2 h-2 rounded-full bg-brand-green"></span>
          <span x-show="!connected" class="w-2 h-2 rounded-full bg-brand-red"></span>
        </div>
        <p class="text-xs text-brand-navySubtext truncate">
          {{ order.pickup_label }} → {{ order.dropoff_label }}
        </p>
      </div>
      <button type="button" @click="closeChat()"
              class="p-2 rounded-full text-brand-navySubtext hover:bg-brand-greyLight
                     focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-greenDark">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Messages -->
    <div x-ref="messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-2">
      <div x-show="messages.length === 0" class="text-center py-12">
        <div class="w-14 h-14 mx-auto rounded-full bg-brand-greyLight flex items-center justify-center mb-3">
          <i data-lucide="message-circle" class="w-7 h-7 text-brand-navySubtext"></i>
        </div>
        <p class="text-sm font-medium text-brand-navy">No messages yet</p>
        <p class="text-xs text-brand-navySubtext mt-1">Say hi to get started.</p>
      </div>

      <template x-for="m in messages" :key="m.id">
        <div :class="m.sender_id === currentUserId ? 'flex justify-end' : 'flex justify-start'">
          <div :class="m.sender_id === currentUserId
                  ? 'bg-brand-green text-white'
                  : 'bg-brand-greyLight text-brand-navy'"
               class="max-w-[75%] rounded-2xl px-4 py-2.5">
            <p class="text-sm whitespace-pre-wrap break-words" x-text="m.body"></p>
            <p class="text-[10px] mt-1 opacity-70" x-text="formatTime(m.created_at)"></p>
          </div>
        </div>
      </template>
    </div>

    <!-- Input -->
    <form @submit.prevent="send()"
          class="border-t border-brand-grey p-3 flex items-center gap-2">
      <input type="text" x-model="draft" maxlength="2000"
             placeholder="Type a message…"
             class="flex-1 rounded-full border border-brand-grey bg-white px-4 py-3
                    text-sm text-brand-navy placeholder:text-brand-navySubtext
                    focus:outline-none focus:border-brand-green focus:ring-2 focus:ring-brand-green/30">
      <button type="submit" :disabled="!draft.trim()"
              class="w-11 h-11 rounded-full bg-brand-green text-white shrink-0
                     flex items-center justify-center
                     disabled:opacity-50 disabled:cursor-not-allowed
                     active:scale-95 transition-transform
                     focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-greenDark">
        <i data-lucide="send" class="w-5 h-5"></i>
      </button>
    </form>
  </div>
</div>
