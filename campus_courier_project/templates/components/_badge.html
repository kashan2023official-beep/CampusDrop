{% comment %}
Badge Component
Accepts:
  label   (string, required)
  variant ('green' | 'yellow' | 'blue' | 'purple' | 'red' | 'grey' — default 'grey')
{% endcomment %}
{% with badge_variant=variant|default:"grey" %}
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium {% if badge_variant == 'green' %}bg-brand-greenSoft text-brand-greenDarkText{% elif badge_variant == 'yellow' %}bg-brand-yellow/20 text-brand-yellowDark{% elif badge_variant == 'blue' %}bg-brand-blue/20 text-brand-blueDarkText{% elif badge_variant == 'purple' %}bg-brand-purple/15 text-brand-purple{% elif badge_variant == 'red' %}bg-brand-red/15 text-brand-redDarkText{% else %}bg-brand-greyLight text-brand-navySubtext{% endif %}">
  {{ label }}
</span>
{% endwith %}
